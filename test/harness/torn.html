<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stand-in Torn page</title>
<style>
  /* A stand-in for Torn's pages: its layout words only (class names the readers look for). Nothing here is Torn's. */
  body { margin: 0; background: #191919; color: #ccc; font: 13px/1.4 Arial, sans-serif; }
  #mainContainer { width: 976px; margin: 0 auto; padding: 16px 0 80px; }
  h1 { font-size: 18px; color: #ddd; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  /* One listing as Torn's bazaar draws it (seen on the owner's page, 2026-10-11): the tile; closed, the card in it
     (picture, name, price, stock and the button that opens the buy form); OPEN, the buy form IN PLACE of the card -
     name, price, "(N in stock)", the number box and Buy - and no picture on the page at all. */
  .item___h { background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 4px; }
  .itemDescription___h { padding: 14px 10px 10px; }
  .itemDescription___h img { width: 60px; height: 30px; object-fit: contain; display: block; }
  .itemDescription___h p { margin: 4px 0; }
  .buyMenu___h { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 14px 10px 10px; background: #232323; }
  .buyMenu___h p { margin: 0 0 4px; width: 100%; }
  .buyMenu___h input { width: 70px; background: #1b1b1b; border: 1px solid #444; color: #ccc; padding: 3px 6px; }
  button, .btn { background: #555; color: #eee; border: 0; border-radius: 3px; padding: 4px 12px; cursor: pointer; }
  .trade-cont { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .trade-cont ul { list-style: none; margin: 0; padding: 0; }
  .trade-cont .title-black { padding: 7px 10px; background: #222; }
  .trade-cont ul.desc > li { padding: 8px 10px; border-top: 1px solid #3a3a3a; background: #2a2a2a; }
  .set { margin: 12px 0; padding: 10px; background: #2a2a2a; border-radius: 4px; }
  .set ul { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 10px 0; }
  .set li { width: 66px; padding: 14px 0 4px; text-align: center; background: #222; border: 1px solid #3a3a3a; border-radius: 4px; }
  .set li img { width: 38px; height: 19px; }
  .set input, .pm input { width: 90px; background: #1b1b1b; border: 1px solid #444; color: #ccc; padding: 3px 6px; }
  .pm { padding: 10px; background: #2a2a2a; border-radius: 4px; display: flex; gap: 8px; align-items: center; }
  .pm .ask[hidden] { display: none; } .pm .ask a { color: #74c0fc; margin-left: 10px; }
  .pm-list { list-style: none; margin: 14px 0 0; padding: 0; overflow: hidden; border-radius: 4px; }
  .pm-list li { display: flex; border-top: 1px solid #111; }
  .pm-list li span { flex: 1; padding: 13px 10px; background: #2a2a2a; border-right: 1px solid #111; text-align: right; }
  .pm-list li span:first-child { flex: 2.4; text-align: left; }
  .pm-list li.h span { background: #222; font-weight: bold; }
  .thread h4 { margin: 0; padding: 10px; background: #222; }
  .log { margin-top: 20px; padding: 10px; background: #111; color: #8a8; white-space: pre-wrap; font: 12px/1.5 Consolas, monospace; }
</style></head>
<body>
<!--
  Torn Archive's box and marks on stand-in Torn pages (made-up desk, test/fixture-view.js). Nothing is asked of Torn.
    ?page=bazaar&userId=N   a bazaar (the first stop of a made list when userId is left out)   &run=1  a run started
                            &away=1  one listing of the list is not on the page (further down, or sold)
    ?page=bazaar&im=1       stands in for the Item Market
    ?page=trade#step=view&ID=N   a trade (&money=1: the add-money step; &more=1: ten more of its first piece on the page than the hub read)
    &late=N   the hub last answered N minutes ago
    ?page=museum   ?page=pmarket   ?page=forum#/p=threads&t=N
    &old=1  the shared view is 20 minutes old      &none=1  nothing shared yet     &trading=1  Torn Trading on this page
    &trading=1&panel=1  with its panel, where Torn Trading stands it (430 wide or the free strip, min(75vh, 640px) tall,
                        16px from the window's foot)       &panel=fold  that panel folded to its bar
    ?page=other   a page of Torn's that is none of ours          &key=1  a key was pasted in Settings once
-->
<div id="mainContainer"></div>
<script type="module">
import { archiveView, viewForTabs, viewPiece } from '../../src/core/view.js';
import { fillList, stopsOf, runStart } from '../../src/core/shopping.js';
import { SETS } from '../../src/core/sets.js';
import { gmSet, gmGet } from '../../src/platform/gm.js';
import { mountTornPage, SHARED_VIEW_KEY, SHARED_NOTES_KEY } from '../../src/ui/torn-page.js';
import { fixtureInput } from '../fixture-view.js';

const q = new URLSearchParams(location.search);
const page = q.get('page') || 'bazaar';
const now = Date.now();
const input = fixtureInput(now);
let view = archiveView(input);
if (page === 'bazaar' || q.has('list')) {
    input.cart = fillList(view.pieces, (id) => input.offers(id).filter((o) => o.ok !== false));
    const stops = stopsOf(input.cart, (id) => (viewPiece(view, id) || {}).worth || 0);
    if (q.has('run')) input.run = runStart(stops);
    view = archiveView(input);
}
const main = document.getElementById('mainContainer');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pic = (id) => `<img src="https://www.torn.com/images/items/${id}/large.png" alt="">`;
const money = (n) => '$' + Math.round(n).toLocaleString('en-US');

if (page === 'bazaar') {
    const stops = view.buy.run.stops;
    const stop = q.get('userId') ? stops.find((s) => String(s.whoId) === q.get('userId')) : stops.find((s) => !s.im);
    if (!q.get('userId') && stop && !q.has('im')) { q.set('userId', stop.whoId); history.replaceState(null, '', '?' + q.toString() + location.hash); }
    // The stop's own lines, two pieces that are not on the list, and one item that is no set piece.
    // The first line is the whole listing (buying it takes the listing off the page), the others have more.
    const lines = stop ? stop.lines.slice(q.has('away') ? 1 : 0).map((l, i) => ({ id: l.id, name: l.name, price: l.price, qty: i === 0 ? l.q : l.q + 3 })) : [];
    const extra = view.pieces.filter((p) => !lines.some((l) => String(l.id) === String(p.id))).slice(0, 3).map((p, i) => ({ id: p.id, name: p.name, price: Math.round(p.worth * (i === 0 ? 0.9 : 1.2)), qty: 5 }));
    const cards = [...lines, ...extra, { id: 206, name: 'Xanax', price: 830000, qty: 2 }];
    main.innerHTML = `<h1>${q.has('im') ? 'Item Market' : esc((stop && stop.who) || 'Someone') + "'s Bazaar"}</h1><div class="tiles">` + cards.map((c) =>
        `<div class="item___h" data-id="${c.id}" data-name="${esc(c.name)}" data-price="${c.price}" data-qty="${c.qty}"></div>`).join('') + '</div>';
    const cardOf = (t) => `<div class="itemDescription___h" data-testid="item-description">${pic(t.dataset.id)}<p class="name___x">${esc(t.dataset.name)}</p><p>${money(Number(t.dataset.price))}</p><p class="stock">(${t.dataset.qty} in stock)</p><button class="open" aria-label="Buy: ${esc(t.dataset.name)}">Open the buy menu</button></div>`;
    const formOf = (t) => `<div class="buyMenu___h overPanelContainer___h"><p><span class="name___h infoLine___h">${esc(t.dataset.name)}</span> <span class="price___h infoLine___h">${money(Number(t.dataset.price))}</span> <span class="amount___h infoLine___h">(${t.dataset.qty} in stock)</span> <button class="close___h" aria-label="Close">x</button></p><input class="numberInput___h buyAmountInput___h" type="text" value="1"> <button class="buy___h" aria-label="Buy: ${esc(t.dataset.name)}">Buy</button></div>`;
    for (const t of main.querySelectorAll('.item___h')) t.innerHTML = cardOf(t);
    // The stand-in's own buttons: the menu opens, and "Buy" takes what is typed off the stock, as Torn's page would
    // after the purchase (a listing bought out leaves the page).
    main.addEventListener('click', (e) => {
        const tile = e.target.closest('.item___h');
        if (!tile) return;
        // Opened: the buy form takes the card's place. Closed: the card is back.
        if (e.target.closest('button.open')) { tile.innerHTML = formOf(tile); return; }
        if (e.target.closest('button.close___h')) { tile.innerHTML = cardOf(tile); return; }
        if (!e.target.closest('button.buy___h')) return;
        const input = tile.querySelector('input');
        const typed = Number(input.value.replace(/\D/g, '')) || 0;
        const left = Number(tile.dataset.qty) - typed;
        if (typed <= 0 || left < 0) return;
        // Bought: Torn's own words stand in the tile for a moment (no price, no stock), then the card is back with
        // what is left - or the tile is gone when the listing was bought out. (&slow=1: the words stay 3 s.)
        tile.dataset.qty = String(left);
        tile.innerHTML = `<div class="buyMenu___h"><p>You bought ${typed} x ${esc(tile.dataset.name)}.</p></div>`;
        setTimeout(() => { if (left <= 0) tile.remove(); else tile.innerHTML = cardOf(tile); }, q.has('slow') ? 3000 : 700);
    });
} else if (page === 'trade') {
    const id = (location.hash.match(/ID=(\d+)/) || [])[1];
    const t = view.trades.open.find((x) => String(x.id) === id) || view.trades.open[0];
    if (!id && t) location.hash = 'step=' + (q.has('money') ? 'addmoney' : 'view') + '&ID=' + t.id;
    const firstPiece = t ? t.rows.findIndex((r) => r.state !== 'other') : -1;
    const rows = t ? t.rows.map((r, i) => (q.has('more') && i === firstPiece ? { ...r, qty: r.qty + 10 } : r)) : [];
    main.innerHTML = `<h1>Trade</h1><div class="trade-cont">
      <div class="user left"><div class="title-black">You</div><ul class="cont"><li class="color1"><div class="name">${t && t.myMoney ? money(t.myMoney) : 'No money in trade'}</div></li><li class="color2"><ul class="desc"><li><div class="name">No items in trade</div></li></ul></li></ul></div>
      <div class="user right"><div class="title-black">${esc((t && t.who) || 'Someone')}</div><ul class="cont"><li class="color1"><div class="name">No money in trade</div></li><li class="color2"><ul class="desc">${rows.map((r) => `<li><div class="name">${esc(r.name)} x${r.qty}</div></li>`).join('')}</ul></li></ul></div>
    </div>${q.has('money') ? '<p class="input-money-group"><input class="input-money" type="text" value=""><input class="input-money" type="hidden" name="amount" value=""> <button>Change</button></p>' : ''}`;
} else if (page === 'museum') {
    main.innerHTML = '<h1>Museum</h1>' + SETS.map((s) => `<div class="set"><p>To exchange a ${esc(s.museum)} for ${s.points} points, you need one of each:</p><ul>${s.pieces.map((p) => `<li>${pic(p.id)}</li>`).join('')}</ul>
      <p>Number of sets <input type="text" value=""> <button>EXCHANGE</button></p></div>`).join('');
} else if (page === 'pmarket') {
    // ?rows=none: a list this tab cannot read (the box alone then says the numbers).
    const lots = q.get('rows') === 'none' ? [] : (view.points.ladder || []).flatMap((l) => (l.lots > 1 && l.qty > 1 ? [[Math.floor(l.qty / 2), l.price], [l.qty - Math.floor(l.qty / 2), l.price]] : [[l.qty, l.price]]));
    main.innerHTML = '<h1>Points Market</h1><div class="set" style="padding:0"><p style="padding:8px 10px;margin:0;background:#222"><b>Add listing</b></p><div class="pm"><span class="f">Points: <input type="text" name="amount" value=""></span><span class="f">Price each: <input type="text" name="price" value=""></span><span class="f"><button>ADD LISTING</button></span><span class="ask" hidden></span></div></div>'
        + `<ul class="pm-list"><li class="h"><span>Name</span><span>Points</span><span>Cost Each</span><span>Total Price</span><span>Action</span></li>${lots.map(([n, each], i) => `<li><span>Seller_${i + 1}</span><span>${n.toLocaleString('en-US')}</span><span>$${each.toLocaleString('en-US')}</span><span>$${(n * each).toLocaleString('en-US')}</span><span>buy</span></li>`).join('')}</ul>`;
    // ADD LISTING: Torn asks "Are you sure ...? Yes No". A stand-in for it, not Torn's markup (never read): the
    // form's parts give way to the question inside the same row (the row itself stays, as on his screenshot, where
    // our note was left standing on Yes and No) - or, with &ask=beside, they stay and the question joins them.
    const form = main.querySelector('.pm');
    const ask = main.querySelector('.pm .ask');
    const parts = (shown) => { for (const f of form.querySelectorAll('.f')) f.style.display = shown ? '' : 'none'; };
    const digits = (el) => Number(String(el.value).replace(/\D/g, '')) || 0;
    form.querySelector('button').addEventListener('click', () => {
        const n = digits(form.querySelector('[name=amount]'));
        const each = digits(form.querySelector('[name=price]'));
        if (!n || !each) return;
        ask.innerHTML = `Are you sure you want to sell <b>${n.toLocaleString('en-US')}</b> points for <b>$${each.toLocaleString('en-US')}</b> each (<b>$${(n * each).toLocaleString('en-US')}</b> total)? <a href="#" data-ask="yes">Yes</a> <a href="#" data-ask="no">No</a>`;
        ask.hidden = false;
        if (q.get('ask') !== 'beside') parts(false);
    });
    ask.addEventListener('click', (e) => {
        const a = e.target.closest('[data-ask]');
        if (!a) return;
        e.preventDefault();
        window.asked = [...(window.asked || []), a.dataset.ask];
        ask.hidden = true;
        parts(true);
    });
} else if (page === 'forum') {
    const th = view.prices.thread;
    const title = q.has('exact') ? view.prices.forum.title : (th && th.title) || view.prices.forum.title;
    if (!/t=\d+/.test(location.hash)) location.hash = '/p=threads&f=10&t=' + ((th && th.id) || 16000001);
    main.innerHTML = `<h1>Forums</h1><div class="thread"><h4>${esc(title)}</h4><p style="padding:10px;background:#2a2a2a">The first post.</p></div>`;
} else {
    main.innerHTML = '<h1>Gym</h1><div class="set"><p>A page of Torn\'s that Torn Archive has nothing to say on.</p></div>';
}
if (q.has('trading')) {
    const h = document.createElement('div');
    h.id = 'ttv2-host';
    document.body.appendChild(h);
    // A stand-in for Torn Trading's panel: its place and size only (its own numbers), nothing of what it shows.
    if (q.has('panel')) {
        const root = h.attachShadow({ mode: 'open' });
        root.innerHTML = `<style>.ttv2-panel { position: fixed; right: 16px; bottom: 16px; height: ${q.get('panel') === 'fold' ? '40px' : 'min(75vh, 640px)'}; box-sizing: border-box; display: grid; place-items: center; background: #1c1f26; border: 1px solid #3a3f4b; border-radius: 4px; color: #8b93a3; font: 13px Arial, sans-serif; }</style><div class="ttv2-panel">Torn Trading's panel (stand-in)</div>`;
        const fit = () => { root.querySelector('.ttv2-panel').style.width = Math.max(0, Math.min(430, innerWidth - main.getBoundingClientRect().right - 8 - 16)) + 'px'; };
        fit();
        addEventListener('resize', fit);
    }
}

// &key=1: a key was pasted once (a made-up word: nothing is asked of Torn here).
if (q.has('key')) gmSet('key.limited', 'harness');
if (!q.has('none')) gmSet(SHARED_VIEW_KEY, { at: q.has('old') ? now - 20 * 60000 : now - (Number(q.get('late')) || 0) * 60000, v: JSON.parse(JSON.stringify(viewForTabs(view))) });
const log = document.createElement('div');
log.className = 'log';
main.appendChild(log);
const app = mountTornPage(document, { tabId: 'harness', version: 'harness', scripted: true });
setInterval(() => { const n = gmGet(SHARED_NOTES_KEY, []); const text = 'notes to the hub: ' + JSON.stringify(n.map((x) => [x.kind, x.what])); if (log.textContent !== text) log.textContent = text; }, 500);
window.app = app;
window.viewNow = view;
</script>
</body></html>
